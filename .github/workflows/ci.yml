name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ⛔ A WORKFLOW THAT FAILS TO PARSE REPORTS NOTHING AT ALL -- no red cross, no
  # jobs, and `gh pr checks` answers "no checks reported on the branch", which
  # reads exactly like a check that has not started yet. It happened here on
  # 2026-10-05: an edit landed a step inside a two-key `with:` block, orphaning
  # the second key, and the only symptom was a run named after the FILE instead
  # of the workflow. actionlint is the only thing that catches it, so it is the
  # first lane.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  test:
    name: build + vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # ⛔ SAY WHICH TOOLCHAIN RAN. A green check that does not record the
      # compiler behind it makes every figure measured under it unattributable:
      # go.mod said 1.26 on a sibling repository for weeks while its CI asked
      # for `stable` and ran 1.27, and the only way anybody noticed was reading
      # a job log for this line.
      - run: go version
      - name: gofmt
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then echo "::error::not gofmt-clean:"; echo "$drift"; exit 1; fi
      - name: shellcheck the scripts
        run: |
          set -euo pipefail
          # The scripts run against 1800 repositories; a syntax error in one is
          # a sweep that stops halfway. bash -n is the floor, not a lint.
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: build
        run: CGO_ENABLED=0 go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -timeout 15m ./...

      # ⛔ THE GATE JUDGES ITS OWN REPOSITORY. cmd/vulngate exists to decide
      # what a govulncheck stream means, and no workflow anywhere named it --
      # including this one. A capability nothing invokes is documented, not
      # deployed.
      #
      # ⛔ NO `set -o pipefail` HERE, deliberately. govulncheck exits non-zero
      # over findings it has decided this module does not call, and exits ZERO
      # over some it has -- which is the whole reason vulngate exists. pipefail
      # would hand the lane back to the status that cannot answer the question.
      # An unread scan is caught instead by vulngate, which believes a run only
      # when it carried a config AND an SBOM.
      #
      # ⛔ -go holds the scan to the toolchain it actually ran under. The
      # standard library is judged by one version, and a lane that silently
      # resolved another answered a different question -- which is why the
      # value comes from `go env GOVERSION` and not from a literal.
      - name: govulncheck, judged by vulngate
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" -format json ./... > /tmp/vuln.json || true
          test -s /tmp/vuln.json || { echo "::error::govulncheck wrote nothing at all"; exit 1; }
          # BUILT, not `go run`: a built binary carries the VCS stamp its own
          # staleness check reads, so the gate can say whether it is current.
          go build -o /tmp/vulngate ./cmd/vulngate
          # ⛔ The stream is an ARGUMENT, not stdin. Written with `<` first, and
          # actionlint passed it -- a workflow that parses is not a workflow
          # that runs. Caught by running the lane by hand before pushing it.
          # ⛔ Its staleness note says "could not tell" here, and that is left
          # alone: the check asks gh whether the binary matches the source, and
          # in CI the binary IS this checkout, so the question has no content.
          # Handing it GH_TOKEN would spend a call from the shared hourly budget
          # per run to learn nothing.
          /tmp/vulngate -go "$(go env GOVERSION)" /tmp/vuln.json
