name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ⛔ A WORKFLOW THAT FAILS TO PARSE REPORTS NOTHING AT ALL -- no red cross, no
  # jobs, and `gh pr checks` answers "no checks reported on the branch", which
  # reads exactly like a check that has not started yet. It happened here on
  # 2026-10-05: an edit landed a step inside a two-key `with:` block, orphaning
  # the second key, and the only symptom was a run named after the FILE instead
  # of the workflow. actionlint is the only thing that catches it, so it is the
  # first lane.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  test:
    name: build + vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # ⛔ SAY WHICH TOOLCHAIN RAN. A green check that does not record the
      # compiler behind it makes every figure measured under it unattributable:
      # go.mod said 1.26 on a sibling repository for weeks while its CI asked
      # for `stable` and ran 1.27, and the only way anybody noticed was reading
      # a job log for this line.
      - run: go version
      - name: gofmt
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then echo "::error::not gofmt-clean:"; echo "$drift"; exit 1; fi
      - name: shellcheck the scripts
        run: |
          set -euo pipefail
          # The scripts run against 1800 repositories; a syntax error in one is
          # a sweep that stops halfway. bash -n is the floor, not a lint.
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: build
        run: CGO_ENABLED=0 go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -timeout 15m ./...

      # ⛔ THE WINDOWS HALF OF A PLATFORM SPLIT WAS COMPILED BY NOTHING.
      # cmd/brief has signal_unix.go and signal_windows.go because WaitStatus
      # is not portable -- and signal_unix.go's comment claimed "the tests this
      # fleet runs include windows-latest", which is true of go-crdt and was
      # never true here: every lane in this file is ubuntu. cmd/buildscan, run
      # against this very repository on the day it was written, named the file.
      #
      # A whole runner is not needed to close it. `go vet` cross-compiles, so
      # this costs seconds and no second job.
      #
      # ⛔ WRITTEN OUT RATHER THAN LOOPED, so that a reader which is not a
      # shell can see which platforms these are. The first version was
      # `for goos in windows darwin; do GOOS=$goos go vet ./...; done`, and
      # buildscan reported the step as a configuration it could not resolve --
      # correctly, since the value is a loop variable. A configuration hidden
      # in a shell loop is invisible to every instrument that reads workflows,
      # which is the same shape as the packages testscan cannot see behind a
      # `go test $PKGS`.
      - name: vet for windows
        run: GOOS=windows go vet ./...
      - name: vet for darwin
        run: GOOS=darwin go vet ./...

      # ⛔ THE govulncheck GATE LIVES IN vuln.yml NOW, AND IT MOVED RATHER THAN
      # BEING COPIED. It was here, under the same job name -- "govulncheck,
      # judged by vulngate" -- and it only ever ran when somebody pushed, which
      # gives it the coverage of this repository's activity rather than of the
      # advisory database. vuln.yml adds a daily schedule and a
      # workflow_dispatch to the same two events, and carries the fleet sweep
      # beside it.
      #
      # Leaving a copy here would be the two-halves defect: one copy gets the
      # next fix and the other keeps the old behaviour, with nothing to say
      # which one a given run used. vuln.yml is the only definition.
