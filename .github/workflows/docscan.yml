# Runs docscan every Monday and records what it found.
#
# ⛔ A tool nobody runs is a rule nobody follows, which is the argument in
# docscan's own doc comment. go-fsctl carried a data file promising "one card
# per real repo in the org" while listing five of seven, for three weeks, on
# four surfaces at once — and every one of those surfaces was edited by
# somebody who never opened the other three.
name: docscan

on:
  schedule:
    # Monday morning, before the week's work starts adding to it.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: what each organisation has, against what it says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # ⛔ The scan reads OTHER organisations, which GITHUB_TOKEN cannot do: it
      # is scoped to this repository. Without a token that can list them, `gh
      # repo list` returns nothing and every organisation reads as having no
      # modules — a clean sweep produced by being unable to look. So this
      # refuses to run rather than reporting zero.
      - name: the token has to be able to see the fleet
        env:
          GH_TOKEN: ${{ secrets.FLEET_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::FLEET_TOKEN is not set. docscan reads every organisation;" \
                 "GITHUB_TOKEN cannot, and an unreadable fleet reports no drift."
            exit 1
          fi
          n=$(gh api user/orgs --paginate --jq '.[].login' | wc -l)
          echo "organisations visible to this token: $n"
          if [ "$n" -lt 2 ]; then
            echo "::error::the token sees $n organisations, which is not the fleet."
            exit 1
          fi

      - name: scan
        env:
          GH_TOKEN: ${{ secrets.FLEET_TOKEN }}
        run: |
          set -o pipefail
          go run ./cmd/docscan | tee docscan.txt
          {
            echo '## docscan'
            echo
            echo '```'
            tail -1 docscan.txt
            echo '```'
            echo
            echo '<details><summary>the whole report</summary>'
            echo
            echo '```'
            cat docscan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # One issue, updated. A new issue a week is a mailing list nobody reads.
      - name: record it in the tracking issue
        env:
          GH_TOKEN: ${{ secrets.FLEET_TOKEN }}
        run: |
          title='docs drift: what each organisation has, against what it says'
          body=$(printf '%s\n\n```\n%s\n```\n' \
            "Updated by the docscan workflow on $(date -u +%Y-%m-%d)." "$(cat docscan.txt)")
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "updated #$n"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
