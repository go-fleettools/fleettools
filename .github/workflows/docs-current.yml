# A reusable check: does this organisation advertise what it has?
#
# Called BY the organisation's own landing repository, so it fails at the
# moment somebody changes the landing — not a week later in a report nobody
# opened. Nine lines in the caller:
#
#   name: docs
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     current:
#       uses: go-fleettools/fleettools/.github/workflows/docs-current.yml@main
#
# ⛔ NOT `on: [push, pull_request]`. Both fire for a branch that has a pull
# request open, so every push runs this twice — measured on the three
# organisations that copied this snippet (go-encryptions, go-volumes, go-mswin):
# four check runs per pull request where two were wanted. The FIRST adopter,
# go-filesystems, never doubled: its caller was written with the narrow trigger,
# and only this comment was wrong. The surface that taught the others was the
# one place the fix had not reached. Across the fleet that is a doubled bill against a shared hourly API
# budget Renovate also draws on. Narrowing push to main keeps the default
# branch watched and costs one run per pull request.
#
# ⛔ IT NEEDS NO SECRET, and that is the point. Listing a public organisation
# and reading its landing are public reads — measured: `GET /orgs/<org>/repos`
# answers 200 with no token at all. An earlier version of this ran centrally
# on a schedule and needed a token that could see all 334 organisations, which
# is a thing somebody has to create, remember and rotate. A check that cannot
# run is a check that does not exist.
name: docs-current

on:
  workflow_call:
    inputs:
      org:
        description: the organisation to check; defaults to the caller's owner
        required: false
        type: string

permissions:
  contents: read

jobs:
  current:
    name: the landing names what the organisation has
    runs-on: ubuntu-latest
    steps:
      - name: check out the scanner
        uses: actions/checkout@v7
        with:
          repository: go-fleettools/fleettools
          ref: main
          path: scanner

      # ⛔ THE BRANCH UNDER REVIEW, because every surface is otherwise read over
      # the API — which serves the DEFAULT BRANCH. Measured on
      # go-filesystems.github.io#15: a pull request adding ten cards was told
      # all ten were missing, because the check never read them. The false red
      # is the harmless half; the same blindness passes a pull request that
      # DELETES every card.
      - name: check out the branch under review
        uses: actions/checkout@v7
        with:
          path: caller

      - uses: actions/setup-go@v7
        with:
          go-version-file: scanner/go.mod
      # ⛔ SAY WHICH TOOLCHAIN RAN. A green check that does not record the
      # compiler behind it makes every figure measured under it unattributable:
      # go.mod said 1.26 on a sibling repository for weeks while its CI asked
      # for `stable` and ran 1.27, and the only way anybody noticed was reading
      # a job log for this line.
      - run: go version

      - name: scan this organisation
        env:
          # The default token is enough for public reads and gives a workable
          # rate limit. It cannot see private repositories, which is correct:
          # a private module is not something the landing should advertise.
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ inputs.org || github.repository_owner }}
          CALLER: ${{ github.repository }}
        working-directory: scanner
        run: |
          set -o pipefail
          go run ./cmd/docscan \
            -orgs "$ORG" \
            -tree "$CALLER=$GITHUB_WORKSPACE/caller" \
            -fail-on-drift | tee report.txt
          {
            echo '## docs-current'
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: what a failure means
        if: failure()
        run: |
          echo "::notice::This organisation has a repository its landing, documentation" \
               "or profile does not name — or names one that is gone. The report above" \
               "says which, and on which surfaces."
          echo "::notice::Being unlisted can be a choice: an experiment, a placeholder," \
               "a module that moved. Say so in a .docs-unlisted file at the root of this" \
               "repository, one line per repository: the name, a space, and WHY. The" \
               "reason is required, and the report keeps printing the line — the file" \
               "moves a repository from invisible to accounted for, it does not hide it."
